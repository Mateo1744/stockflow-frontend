services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockflow}
      POSTGRES_USER: ${POSTGRES_USER:-stockflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - stockflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  stockflow-api:
    build: ../stockflow-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-stockflow}
      DB_USERNAME: ${POSTGRES_USER:-stockflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STOCKFLOW_BOOTSTRAP_ADMIN_ENABLED: ${STOCKFLOW_BOOTSTRAP_ADMIN_ENABLED:-false}
      STOCKFLOW_BOOTSTRAP_ADMIN_EMAIL: ${STOCKFLOW_BOOTSTRAP_ADMIN_EMAIL:-}
      STOCKFLOW_BOOTSTRAP_ADMIN_PASSWORD: ${STOCKFLOW_BOOTSTRAP_ADMIN_PASSWORD:-}
      STOCKFLOW_BOOTSTRAP_ADMIN_FIRST_NAME: ${STOCKFLOW_BOOTSTRAP_ADMIN_FIRST_NAME:-}
      STOCKFLOW_BOOTSTRAP_ADMIN_LAST_NAME: ${STOCKFLOW_BOOTSTRAP_ADMIN_LAST_NAME:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  stockflow-frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    depends_on:
      stockflow-api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  stockflow-data:
